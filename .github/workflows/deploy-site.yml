# Rebuilds the static student site every night so the menu baked into its
# HTML (src/lib/site/menuSnapshot.ts) matches the current week. Crawlers and
# AI assistants read that copy; browsers load the live menu from the API.
# Run it by hand (Actions > Deploy student site > Run workflow) after editing
# the menu in the admin console.
#
# Secrets: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template),
# CLOUDFLARE_ACCOUNT_ID.
name: Deploy student site

on:
  schedule:
    - cron: "10 19 * * *" # 00:10 PKT
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run cf:deploy:site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
